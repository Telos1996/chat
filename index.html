<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Чат">
<title>Чат</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#1c2420;--mute:#6d7a73;--me:#1f7a5c;--meink:#fff;--other:#e3e9e5;--line:#d8e0db}
@media(prefers-color-scheme:dark){:root{--bg:#121816;--card:#1a221f;--ink:#e8efeb;--mute:#8a9892;--me:#2a9d78;--other:#26302c;--line:#2c3732}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:-apple-system,system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
header{padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
header b{font-size:17px}header span{font-size:13px;color:var(--mute);flex:1}
.ic{background:none;color:var(--ink);padding:6px 10px;font-size:22px;border-radius:10px}
#join{margin:auto;width:min(360px,90%);background:var(--card);padding:24px;border-radius:16px;border:1px solid var(--line)}
#join h1{margin:0 0 4px;font-size:22px}#join p{margin:0 0 16px;color:var(--mute);font-size:14px}
input[type=text],input[type=password],input:not([type]){width:100%;font:inherit;font-size:16px;padding:12px;margin-bottom:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{font:inherit;font-size:16px;border:0;border-radius:10px;background:var(--me);color:var(--meink);padding:12px 18px;cursor:pointer}
#chat{display:none;flex:1;min-height:0;flex-direction:column}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:9px 13px;border-radius:18px;background:var(--other);word-wrap:break-word;white-space:pre-wrap}
.m.me{align-self:flex-end;background:var(--me);color:var(--meink)}
.m small{display:block;font-size:12px;color:var(--mute);margin-bottom:2px}
.m time{display:block;font-size:11px;opacity:.6;margin-top:2px;text-align:right}
.m img,.m video{max-width:100%;border-radius:12px;display:block;margin:2px 0}
form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);align-items:center}
form input[type=text]{margin:0;flex:1}
.lk{overflow:hidden;border-radius:12px}.lk img.b{filter:blur(9px);width:100%;min-width:190px}.lk button{width:100%;margin-top:6px;padding:9px;font-size:15px}
#warn{background:#fff3cd;color:#664d03;font-size:13px;padding:8px 16px;display:none}
#inc{display:none;position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:20;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;align-items:center;gap:8px;box-shadow:0 4px 20px #0004}
#inc span{flex:1}
.red{background:#d64545}
#call{display:none;position:fixed;inset:0;z-index:30;background:#000;flex-direction:column}
#rv{flex:1;min-height:0;width:100%;object-fit:cover;background:#111}
#lv{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);width:100px;height:140px;object-fit:cover;border-radius:12px;background:#222;transform:scaleX(-1)}
#cs{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 14px);text-align:center;color:#fff;text-shadow:0 1px 4px #000}
#ctl{display:flex;justify-content:center;gap:16px;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
#ctl button{width:56px;height:56px;border-radius:50%;font-size:22px;padding:0;background:#ffffff30}
</style>
</head>
<body>
<div id="warn"></div>

<div id="join">
  <h1>Чат</h1>
  <p>Найзуудтайгаа ижил өрөөний нэр бичиж орно уу.</p>
  <input id="nick" placeholder="Таны нэр" maxlength="12" autocomplete="off">
  <input id="pw" type="password" placeholder="Нууц үг (6+ тэмдэгт)" autocomplete="current-password">
  <input id="room" placeholder="Өрөөний нэр (жишээ: найзууд)" maxlength="30" autocomplete="off">
  <button id="go" style="width:100%">Орох</button>
  <button id="reg" style="width:100%;margin-top:8px;background:var(--other);color:var(--ink)">Шинээр бүртгүүлэх</button>
</div>

<div id="chat">
  <header><b id="rt"></b><span id="who"></span><button class="ic" id="adm" style="display:none" title="Токен олгох">🪙</button><button class="ic" id="callbtn" title="Видео дуудлага">📹</button></header>
  <div id="msgs"></div>
  <form id="f">
    <button type="button" class="ic" id="clip" style="padding:6px 8px">📎</button>
    <button type="button" class="ic" id="lock" style="padding:6px 8px">🔒</button>
    <input id="file" type="file" accept="image/*,video/*" hidden>
    <input id="lockfile" type="file" accept="image/*" hidden>
    <input id="txt" type="text" placeholder="Мессеж бичих..." autocomplete="off">
    <button>Илгээх</button>
  </form>
</div>

<div id="inc"><span id="incn"></span><button id="acc">Авах</button><button id="dec" class="red">Татгалзах</button></div>

<div id="call">
  <video id="rv" autoplay playsinline></video>
  <video id="lv" autoplay playsinline muted></video>
  <div id="cs"></div>
  <div id="ctl">
    <button id="mic">🎤</button>
    <button id="cam">📷</button>
    <button id="end" class="red">📞</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
// ===== 1. FIREBASE тохиргоо =====
const firebaseConfig = { apiKey:"AIzaSyCttQg-jQyucRDpTwze73k4iVNU47fsuqk", authDomain:"miniichat-11ffb.firebaseapp.com", projectId:"miniichat-11ffb", appId:"1:635776642923:web:ff1d9e84d2738c5707a62e" };
// ===== 2. CLOUDINARY тохиргоо (бичлэг, зураг хадгалах) =====
const cloudinary = { cloudName:"", uploadPreset:"" };
// =================================

const $ = id => document.getElementById(id);
const configured = !!firebaseConfig.projectId;
const hasCloud = !!(cloudinary.cloudName && cloudinary.uploadPreset);
let db=null, nick="", room="", uid=null, bal=0;
if (configured) { firebase.initializeApp(firebaseConfig); db = firebase.firestore(); }

function status(t){ const w=$("warn"); w.textContent=t; w.style.display=t?"block":"none"; }
if(!configured) status("Firebase тохируулаагүй байна. Одоогоор зөвхөн өөрийн утсан дээр туршиж байна.");
try { $("nick").value=localStorage.getItem("nick")||""; $("room").value=localStorage.getItem("room")||""; } catch(e){}

const esc = s => { const d=document.createElement("div"); d.textContent=s; return d.innerHTML; };
const safeUrl = u => /^(https:\/\/|data:image\/)/.test(u||"") ? String(u).replace(/"/g,"%22") : "";

// ---------- Мессеж ----------
function append(m,id){
  const box=$("msgs"), near=box.scrollHeight-box.scrollTop-box.clientHeight<120;
  const me=m.nick===nick, el=document.createElement("div");
  el.className="m"+(me?" me":"");
  const t=m.t?new Date(m.t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"";
  let body=m.text?esc(m.text):"";
  const u=safeUrl(m.url);
  if(u&&m.kind==="image") body=`<a href="${u}" target="_blank"><img src="${u}" loading="lazy"></a>`;
  if(u&&m.kind==="video") body=`<video src="${u}" controls playsinline preload="metadata"></video>`;
  if(m.kind==="locked"){
    el.innerHTML=(me?"":`<small>${esc(m.nick)}</small>`)+`<time>${t}</time>`; box.appendChild(el);
    lockedBody(el,m,id,me); if(near||me) box.scrollTop=box.scrollHeight; return;
  }
  el.innerHTML=(me?"":`<small>${esc(m.nick)}</small>`)+body+`<time>${t}</time>`;
  box.appendChild(el);
  if(near||me) box.scrollTop=box.scrollHeight;
}
const msgs=()=>db.collection("rooms").doc(room).collection("messages");
async function sendMsg(data){
  const m={nick,uid,t:Date.now(),...data};
  if(!configured){ append(m); return; }
  try{ await msgs().add(m); }catch(e){ status("Илгээж чадсангүй: "+e.message); }
}

function enter(){
  room=$("room").value.trim().toLowerCase();
  if(!nick||!room) return;
  try{ localStorage.setItem("nick",nick); localStorage.setItem("room",room); }catch(e){}
  $("join").style.display="none"; $("chat").style.display="flex";
  $("rt").textContent="# "+room; $("who").textContent=nick;
  if(configured){
    msgs().orderBy("t").limitToLast(100).onSnapshot(
      s=>s.docChanges().forEach(c=>c.type==="added"&&append(c.doc.data(),c.doc.id)),
      e=>status("Алдаа: "+e.message));
    listenIncoming();
  }
  $("txt").focus();
}
$("go").onclick=()=>login(false);
$("reg").onclick=()=>login(true);
$("room").addEventListener("keydown",e=>e.key==="Enter"&&login(false));
async function login(create){
  if(!$("room").value.trim()) return status("Өрөөний нэр бичнэ үү.");
  if(!configured){ nick=$("nick").value.trim(); return enter(); }
  try{
    status("Түр хүлээнэ үү..."); const a=firebase.auth(); await new Promise(r=>{ const off=a.onAuthStateChanged(()=>{ off(); r(); }); });
    let u=a.currentUser; const pw=$("pw").value, name=$("nick").value.trim();
    if(!(u&&!pw&&!create)){
      if(!name||pw.length<6) return status("Нэр болон 6+ тэмдэгттэй нууц үг бичнэ үү.");
      const email="u"+[...name.toLowerCase()].map(c=>c.codePointAt(0).toString(16)).join("")+"@chat.app";
      u=(create?await a.createUserWithEmailAndPassword(email,pw):await a.signInWithEmailAndPassword(email,pw)).user;
      if(create){ await db.collection("users").doc(u.uid).set({name}); await db.collection("wallets").doc(u.uid).set({balance:0}); }
    }
    uid=u.uid;
    const us=await db.collection("users").doc(uid).get();
    if(!us.exists){
      await db.collection("users").doc(uid).set({name:name||"user"});
      const ws=await db.collection("wallets").doc(uid).get();
      if(!ws.exists) await db.collection("wallets").doc(uid).set({balance:0});
    }
    nick=us.exists?us.data().name:(name||"user");
    const ad=await db.collection("config").doc("admin").get();
    if(ad.exists&&ad.data().uid===uid) $("adm").style.display="";
    db.collection("wallets").doc(uid).onSnapshot(s=>{ bal=s.exists?s.data().balance:0; $("who").textContent=nick+" · 🪙 "+bal; });
    status(""); enter();
  }catch(e){ status("Алдаа: "+e.message); }
}

// ---------- Нууц зураг (токеноор нээгдэнэ) ----------
$("lock").onclick=()=>{ if(!configured||!uid) return status("Нууц зураг илгээхэд Firebase холбох хэрэгтэй."); $("lockfile").click(); };
$("lockfile").onchange=async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  const price=parseInt(prompt("Нээхэд хэдэн токен вэ?","5"),10);
  if(!(price>0)) return;
  try{
    status("Илгээж байна...");
    const img=await toDataUrl(await resize(f,900,.6)); if(img.length>900000) throw new Error("зураг хэт том байна");
    const thumb=await toDataUrl(await resize(f,32,.5));
    const ref=msgs().doc(), b=db.batch();
    b.set(db.collection("secrets").doc(ref.id),{owner:uid,price,img});
    b.set(ref,{nick,uid,t:Date.now(),kind:"locked",price,thumb});
    await b.commit(); status("");
  }catch(err){ status("Алдаа: "+err.message); }
};
function lockedBody(el,m,id,me){
  const body=document.createElement("div"); body.className="lk";
  body.innerHTML=`<img class="b" src="${safeUrl(m.thumb)}"><button>🔒 ${m.price} токеноор нээх</button>`;
  el.insertBefore(body,el.querySelector("time"));
  const reveal=async()=>{
    try{ const s=await db.collection("secrets").doc(id).get(); body.className=""; body.innerHTML=`<img src="${safeUrl(s.data().img)}">`; }catch(e){}
  };
  if(me){ body.querySelector("button").textContent="🔒 Таны нууц зураг ("+m.price+"🪙) — харах"; body.querySelector("button").onclick=reveal; return; }
  db.collection("unlocks").doc(uid+"_"+id).get().then(d=>d.exists&&reveal()).catch(()=>{});
  body.querySelector("button").onclick=async()=>{
    if(bal<m.price) return status("Токен хүрэлцэхгүй байна (танд "+bal+" байна).");
    if(!confirm(m.price+" токен төлж нээх үү?")) return;
    const ref=uid+"_"+id, inc=firebase.firestore.FieldValue.increment, b=db.batch();
    b.set(db.collection("unlocks").doc(ref),{buyer:uid,seller:m.uid,msg:id,price:m.price});
    b.update(db.collection("wallets").doc(uid),{balance:inc(-m.price),ref});
    b.update(db.collection("wallets").doc(m.uid),{balance:inc(m.price),ref});
    try{ await b.commit(); status(""); reveal(); }catch(e){ status("Төлөх боломжгүй: "+e.message); }
  };
}
$("adm").onclick=async()=>{
  const name=prompt("Хэнд токен өгөх вэ? (бүртгүүлсэн нэр)"); if(!name) return;
  const n=parseInt(prompt("Хэдэн токен?","10"),10); if(!n) return;
  try{
    const q=await db.collection("users").where("name","==",name.trim()).get();
    if(q.empty) return status("Ийм хэрэглэгч олдсонгүй.");
    await db.collection("wallets").doc(q.docs[0].id).update({balance:firebase.firestore.FieldValue.increment(n)});
    status(name+"-д "+n+" токен олголоо.");
  }catch(e){ status("Алдаа: "+e.message); }
};
$("f").onsubmit=e=>{ e.preventDefault(); const text=$("txt").value.trim(); if(!text)return; $("txt").value=""; sendMsg({text}); };

// ---------- Зураг / бичлэг ----------
$("clip").onclick=()=>$("file").click();
function resize(file,max,q){
  return new Promise((ok,bad)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const k=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas"); c.width=img.width*k; c.height=img.height*k;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>b?ok(b):bad(new Error("зураг боловсруулж чадсангүй")),"image/jpeg",q);
      URL.revokeObjectURL(url);
    };
    img.onerror=()=>bad(new Error("зураг уншиж чадсангүй")); img.src=url;
  });
}
const toDataUrl=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b);});
async function upload(blob){
  const fd=new FormData(); fd.append("file",blob); fd.append("upload_preset",cloudinary.uploadPreset);
  const r=await fetch(`https://api.cloudinary.com/v1_1/${cloudinary.cloudName}/auto/upload`,{method:"POST",body:fd});
  const j=await r.json(); if(!j.secure_url) throw new Error(j.error&&j.error.message||"upload алдаа"); return j.secure_url;
}
$("file").onchange=async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  const isVid=f.type.startsWith("video/");
  try{
    status("Илгээж байна...");
    if(isVid){
      if(!hasCloud) return status("Бичлэг илгээхийн тулд Cloudinary тохируулах хэрэгтэй.");
      await sendMsg({kind:"video",url:await upload(f)});
    }else if(hasCloud){
      await sendMsg({kind:"image",url:await upload(await resize(f,1600,.8))});
    }else{
      const d=await toDataUrl(await resize(f,900,.6));
      if(d.length>900000) throw new Error("зураг хэт том байна");
      await sendMsg({kind:"image",url:d});
    }
    status("");
  }catch(err){ status("Алдаа: "+err.message); }
};

// ---------- Видео дуудлага (WebRTC) ----------
const ICE={iceServers:[{urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]}]};
let pc=null,stream=null,callRef=null,unsubs=[],pend=[],incId=null,ringT=null;
const calls=()=>db.collection("rooms").doc(room).collection("calls");

async function media(){
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:true});
  $("lv").srcObject=stream;
}
function mkpc(mineCol){
  pc=new RTCPeerConnection(ICE);
  stream.getTracks().forEach(t=>pc.addTrack(t,stream));
  pc.ontrack=e=>{ $("rv").srcObject=e.streams[0]; $("cs").textContent=""; };
  pc.onicecandidate=e=>e.candidate&&mineCol.add(e.candidate.toJSON());
  pc.onconnectionstatechange=()=>{ if(pc&&pc.connectionState==="failed"){ status("Холболт тасарлаа"); hang(true); } };
}
const addCand=c=>pc.remoteDescription?pc.addIceCandidate(c).catch(()=>{}):pend.push(c);
async function setRemote(d){ await pc.setRemoteDescription(d); pend.splice(0).forEach(c=>pc.addIceCandidate(c).catch(()=>{})); }
function watchEnd(){ unsubs.push(callRef.onSnapshot(s=>{ const d=s.data(); if(d&&d.status==="ended") hang(false); })); }

$("callbtn").onclick=async()=>{
  if(!configured) return status("Видео дуудлагад Firebase тохируулах хэрэгтэй.");
  if(callRef) return;
  try{ await media(); }catch(e){ return status("Камер, микрофоны зөвшөөрөл өгнө үү (Settings → Safari)."); }
  $("call").style.display="flex"; $("cs").textContent="Залгаж байна...";
  callRef=calls().doc();
  mkpc(callRef.collection("callerCandidates"));
  const offer=await pc.createOffer(); await pc.setLocalDescription(offer);
  await callRef.set({from:nick,status:"ringing",t:Date.now(),offer:{type:offer.type,sdp:offer.sdp}});
  unsubs.push(callRef.onSnapshot(async s=>{
    const d=s.data(); if(!d||!pc) return;
    if(d.answer&&!pc.currentRemoteDescription){ await setRemote(d.answer); $("cs").textContent="Холбогдож байна..."; }
    if(d.status==="ended") hang(false);
  }));
  unsubs.push(callRef.collection("calleeCandidates").onSnapshot(s=>s.docChanges().forEach(c=>c.type==="added"&&addCand(c.doc.data()))));
  ringT=setTimeout(()=>{ if(pc&&!pc.currentRemoteDescription){ status("Хариу өгсөнгүй"); hang(true); } },45000);
};

function listenIncoming(){
  calls().where("status","==","ringing").onSnapshot(s=>s.docChanges().forEach(c=>{
    const d=c.doc.data();
    if(c.type==="added"&&d.from!==nick&&Date.now()-d.t<45000&&!callRef){
      incId=c.doc.id; $("incn").textContent="📹 "+d.from+" залгаж байна"; $("inc").style.display="flex";
    }
    if(c.type==="removed"&&incId===c.doc.id){ incId=null; $("inc").style.display="none"; }
  }));
}
$("dec").onclick=()=>{ if(incId) calls().doc(incId).update({status:"ended"}).catch(()=>{}); incId=null; $("inc").style.display="none"; };
$("acc").onclick=async()=>{
  const id=incId; incId=null; $("inc").style.display="none"; if(!id||callRef) return;
  try{ await media(); }catch(e){ return status("Камер, микрофоны зөвшөөрөл өгнө үү."); }
  $("call").style.display="flex"; $("cs").textContent="Холбогдож байна...";
  callRef=calls().doc(id);
  mkpc(callRef.collection("calleeCandidates"));
  const d=(await callRef.get()).data();
  await setRemote(d.offer);
  const a=await pc.createAnswer(); await pc.setLocalDescription(a);
  await callRef.update({answer:{type:a.type,sdp:a.sdp},status:"active"});
  unsubs.push(callRef.collection("callerCandidates").onSnapshot(s=>s.docChanges().forEach(c=>c.type==="added"&&addCand(c.doc.data()))));
  watchEnd();
};

function hang(notify){
  clearTimeout(ringT);
  if(callRef&&notify) callRef.update({status:"ended"}).catch(()=>{});
  unsubs.splice(0).forEach(u=>u());
  if(pc){ pc.close(); pc=null; }
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  $("rv").srcObject=null; $("lv").srcObject=null;
  $("call").style.display="none"; callRef=null; pend=[];
}
$("end").onclick=()=>hang(true);
$("mic").onclick=()=>{ const t=stream&&stream.getAudioTracks()[0]; if(t){ t.enabled=!t.enabled; $("mic").textContent=t.enabled?"🎤":"🔇"; } };
$("cam").onclick=()=>{ const t=stream&&stream.getVideoTracks()[0]; if(t){ t.enabled=!t.enabled; $("cam").textContent=t.enabled?"📷":"🚫"; } };
</script>
</body>
</html>
